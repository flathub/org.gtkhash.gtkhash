app-id: org.gtkhash.gtkhash
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: gtkhash

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Allow opening files from cmdline, drag-and-drop, file chooser
  - --filesystem=host

modules:
  - name: gtkhash
    sources:
      - type: archive
        url: https://github.com/tristanheaven/gtkhash/releases/download/v1.5/gtkhash-1.5.tar.xz
        sha256: 7102a192eca3e82ed67a8252a6850440e50c1dbea7c6364bda154ec80f8ff005
    buildsystem: meson
    config-opts:
      - -Dgcrypt=true
      - -Dblake2=false
      - -Dnative-file-chooser=false # https://github.com/flatpak/xdg-desktop-portal/issues/463
    post-install:
      # meson should probably be doing this
      - glib-compile-schemas --strict /app/share/glib-2.0/schemas
